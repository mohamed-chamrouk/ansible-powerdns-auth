---
- hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - rrset-vars.yml

  vars:
    ansible_python_interpreter: python
    pdns_version: "{{ lookup('ansible.builtin.env', 'pdns_version') }}"
    api_key: foo

  pre_tasks:
    - name: Creating template for all rrset types
      ansible.builtin.template:
        src: ./template/all-rrset-types.yml.j2
        dest: ./test-rrset-all-types.yml

    - name: check "Native" zone creation
      kpfleming.powerdns_auth.zone:
        api_key: "{{ api_key }}"
        name: rrset.example.
        state: present
        properties:
          kind: Native
          account: test-account1
          nameservers:
            - ns.example.
          soa:
            mname: localhost.
            rname: hostmaster.localhost.
        metadata:
          allow_axfr_from:
            - AUTO-NS
          ixfr: true
          axfr_source: 127.0.0.1
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - result['exception'] is not defined
          - not result.failed
          - result.changed
          - result.zone.name == "rrset.example."
          - result.zone.kind == "Native"
          - result.zone.account == "test-account1"
          - result.zone.metadata.allow_axfr_from[0] == "AUTO-NS"
          - result.zone.metadata.ixfr
          - result.zone.metadata.axfr_source == "127.0.0.1"

  tasks:
    - name: creating each type of supported DNS record
      ansible.builtin.include_tasks:
        file: test-rrset-all-types.yml
