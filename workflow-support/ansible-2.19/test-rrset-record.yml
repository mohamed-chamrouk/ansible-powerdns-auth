---
- hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: python
    pdns_version: "{{ lookup('ansible.builtin.env', 'pdns_version') }}"
    common_args: &common
      api_key: foo
    d1_rrset: ["192.168.0.1"]
    d2_rrset: ["192.168.1.1", "192.168.1.2", "192.168.1.3"]
    d3t1_rrset: ["192.168.2.1"]
    d3t2_rrset: ["192.168.2.2", "192.168.2.3"]

  pre_tasks:
    - name: Creating zone with single rrset and single record
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d1.rrset-record.example.
        state: present
        properties:
          kind: Native
          nameservers:
            - ns.example.
          soa:
            mname: localhost.
            rname: hostmaster.localhost.
          rrsets:
            - name: t1.d1.rrset-record.example.
              type: A
              records: "{{ d1_rrset | map('dict_kv', 'content') | list }}"
      ignore_errors: true
      register: result_d1

    - name: Creating zone with single rrset and multiple records
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d2.rrset-record.example.
        state: present
        properties:
          kind: Native
          nameservers:
            - ns.example.
          soa:
            mname: localhost.
            rname: hostmaster.localhost.
          rrsets:
            - name: t1.d2.rrset-record.example.
              type: A
              records: "{{ d2_rrset | map('dict_kv', 'content') | list }}"
      ignore_errors: true
      register: result_d2

    - name: Creating zone with multiple rrsets
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d3.rrset-record.example.
        state: present
        properties:
          kind: Native
          nameservers:
            - ns.example.
          soa:
            mname: localhost.
            rname: hostmaster.localhost.
          rrsets:
            - name: t1.d3.rrset-record.example.
              type: A
              records: "{{ d3t1_rrset | map('dict_kv', 'content') | list }}"
            - name: t2.d3.rrset-record.example.
              type: A
              records: "{{ d3t2_rrset | map('dict_kv', 'content') | list }}"
      ignore_errors: true
      register: result_d3

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in item'
          - not item.failed
          - item.changed
      loop:
        - "{{ result_d1 }}"
        - "{{ result_d2 }}"
        - "{{ result_d3 }}"

    - ansible.builtin.assert:
        quiet: true
        that:
          - (item[1] | split(',') | sort) == item[0]
      loop:
        - "{{ d1 }}"
        - "{{ d2 }}"
        - "{{ d3t1 }}"
        - "{{ d3t2 }}"
      vars:
        d1_retrieved_rrset: "{{ lookup('dig_local', 't1.d1.rrset-record.example.', qtype='A', flat=1, fail_on_error=false, real_empty=false) }}"
        d2_retrieved_rrset: "{{ lookup('dig_local', 't1.d2.rrset-record.example.', qtype='A', flat=1, fail_on_error=false, real_empty=false) }}"
        d3t1_retrieved_rrset: "{{ lookup('dig_local', 't1.d3.rrset-record.example.', qtype='A', flat=1, fail_on_error=false, real_empty=false) }}"
        d3t2_retrieved_rrset: "{{ lookup('dig_local', 't2.d3.rrset-record.example.', qtype='A', flat=1, fail_on_error=false, real_empty=false) }}"
        d1:
          - "{{ d1_rrset }}"
          - "{{ d1_retrieved_rrset }}"
        d2:
          - "{{ d2_rrset }}"
          - "{{ d2_retrieved_rrset }}"
        d3t1:
          - "{{ d3t1_rrset }}"
          - "{{ d3t1_retrieved_rrset }}"
        d3t2:
          - "{{ d3t2_rrset }}"
          - "{{ d3t2_retrieved_rrset }}"

  tasks:
    - name: check adding rrset to existing zone
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d1.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t2.d1.rrset-record.example.
              type: A
              changetype: REPLACE
              records:
                - content: 10.0.0.1
                - content: 10.0.0.2
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (d1t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["10.0.0.1", "10.0.0.2"]
          - (d1t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A']
          - (d1t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600]
      vars:
        d1t2_rrset: "{{ lookup('dig_local', 't2.d1.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check replacing records on existing rrset in existing zone
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d1.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t2.d1.rrset-record.example.
              type: A
              changetype: REPLACE
              records:
                - content: 172.16.0.1
                - content: 172.16.0.2
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (d1t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["172.16.0.1", "172.16.0.2"]
          - (d1t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A']
          - (d1t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600]
      vars:
        d1t2_rrset: "{{ lookup('dig_local', 't2.d1.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check adding records on existing rrset in existing zone
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d1.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t2.d1.rrset-record.example.
              type: A
              changetype: REPLACE
              keep: true
              records:
                - content: 172.16.0.3
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (d1t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["172.16.0.1", "172.16.0.2", "172.16.0.3"]
          - (d1t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A', 'A']
          - (d1t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600, 3600]
      vars:
        d1t2_rrset: "{{ lookup('dig_local', 't2.d1.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check adding records on existing rrset in existing zone and adding rrset
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d1.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t2.d1.rrset-record.example.
              type: A
              changetype: REPLACE
              keep: true
              records:
                - content: 172.16.0.4
            - name: t3.d1.rrset-record.example.
              type: A
              changetype: REPLACE
              records:
                - content: 192.168.32.1
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (d1t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["172.16.0.1", "172.16.0.2", "172.16.0.3", "172.16.0.4"]
          - (d1t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A', 'A', 'A']
          - (d1t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600, 3600, 3600]
          - d1t3_rrset["address"] == "192.168.32.1"
          - d1t3_rrset["type"] == 'A'
          - d1t3_rrset["ttl"] == 3600
      vars:
        d1t2_rrset: "{{ lookup('dig_local', 't2.d1.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"
        d1t3_rrset: "{{ lookup('dig_local', 't3.d1.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check deleting record from existing rrset in existing zone
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d2.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t1.d2.rrset-record.example.
              type: A
              changetype: DELETE
              keep: true
              records:
                - content: 192.168.1.1
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (d2t1_rrset | sort(attribute='address') | map(attribute='address') | list) == ["192.168.1.2", "192.168.1.3"]
          - (d2t1_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A']
          - (d2t1_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600]
      vars:
        d2t1_rrset: "{{ lookup('dig_local', 't1.d2.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check deleting rrsets from existing zone
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d2.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t1.d2.rrset-record.example.
              type: A
              changetype: DELETE
            - name: t2.d2.rrset-record.example.
              type: A
              changetype: DELETE
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - d2t1_rrset == d2t2_rrset == "NXDOMAIN"
      vars:
        d2t1_rrset: "{{ lookup('dig_local', 't1.d2.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"
        d2t2_rrset: "{{ lookup('dig_local', 't2.d2.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check idempotent change on rrset
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d3.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t1.d3.rrset-record.example.
              type: A
              changetype: REPLACE
              keep: true
              records:
                - content: 192.168.2.1
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - not result.changed
          - d3t1_rrset["address"] == "192.168.2.1"
      vars:
        d3t1_rrset: "{{ lookup('dig_local', 't1.d3.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check idempotent deletion on rrset
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d3.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t2.d3.rrset-record.example.
              type: A
              changetype: DELETE
              keep: true
              records:
                - content: 192.168.2.4
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - not result.changed
          - (d3t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["192.168.2.2", "192.168.2.3"]
          - (d3t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A']
          - (d3t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600]
      vars:
        d3t2_rrset: "{{ lookup('dig_local', 't2.d3.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check warning on unsuported option
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d3.rrset-record.example.
        state: present
        properties:
          kind: Master
          rrsets:
            - name: t2.d3.rrset-record.example.
              type: A
              changetype: REPLACE
              keep: true
              records:
                - content: 192.168.2.5
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - result.changed
          - (result.warnings | length) > 0
          - (d3t2_rrset | sort(attribute='address') | map(attribute='address') | list) == ["192.168.2.2", "192.168.2.3", "192.168.2.5"]
          - (d3t2_rrset | sort(attribute='address') | map(attribute='type') | list) == ['A', 'A', 'A']
          - (d3t2_rrset | sort(attribute='address') | map(attribute='ttl') | list) == [3600, 3600, 3600]
      vars:
        d3t2_rrset: "{{ lookup('dig_local', 't2.d3.rrset-record.example.', qtype='A', flat=0, fail_on_error=false, real_empty=false) }}"

    - name: check warning on deletion of non-existant rrset
      kpfleming.powerdns_auth.zone:
        <<: *common
        name: d3.rrset-record.example.
        state: present
        properties:
          rrsets:
            - name: t3.d3.rrset-record.example.
              type: A
              changetype: DELETE
      ignore_errors: true
      register: result

    - ansible.builtin.assert:
        quiet: true
        that:
          - '"exception" not in result'
          - not result.failed
          - not result.changed
          - (result.warnings | length) > 0
